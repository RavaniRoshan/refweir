services:
  refweird:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: refweir/demo:local
    restart: unless-stopped
    environment:
      REFWEIR_LISTEN_ADDR: "0.0.0.0:8080"
      REFWEIR_DATA_DIR: "/var/lib/refweir"
      REFWEIR_PUBLIC_URL: "${DEMO_PUBLIC_URL:-http://localhost:8088}"
      REFWEIR_GIT_URL: "${DEMO_GIT_URL:-localhost:8088}"
      REFWEIR_SSH_ADDR: "none"
      REFWEIR_DEMO_MODE: "1"
      REFWEIR_DEMO_REPO: "demo/agent-lab"
      # Reach this instance's own Git transport from inside the container.
      REFWEIR_DEMO_SELF_URL: "http://refweird:8080"
      REFWEIR_AUDIT_LOG: "/var/lib/refweir/audit.log"
      REFWEIR_JWT_SECRET: "${REFWEIR_JWT_SECRET:?set REFWEIR_JWT_SECRET in deploy/demo/.env (32+ bytes)}"
      REFWEIR_TELEMETRY_OPT_IN: "0"
      REFWEIR_VERSION: "demo"
    volumes:
      - demo-data:/var/lib/refweir
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      refweird:
        condition: service_healthy
    ports:
      - "${DEMO_PORT:-8088}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: 128m

volumes:
  demo-data:
    name: refweir-demo-data
