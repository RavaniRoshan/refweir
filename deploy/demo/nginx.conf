# Hosted demo: refweir demo edge
#
# - Rate limits the public demo at the edge; the app enforces its own 5/hour
#   limit for agent runs.
# - Proxies SSE and Git Smart-HTTP without buffering.
# - TLS is terminated by the operator's load balancer or an upstream proxy.
#
# This file is mounted as /etc/nginx/nginx.conf.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format demo '$remote_addr - $request_method $uri $status '
                    '$body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log demo;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    # Edge limits. The app additionally limits demo agent runs to one every
    # 20 seconds and five per hour per client.
    limit_req_zone $binary_remote_addr zone=demo_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=demo_run:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=demo_conn:10m;

    upstream refweird_demo {
        server refweird:8080;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # Git Smart-HTTP: allow larger packs and disable proxy buffering.
        location ~ /git-(upload|receive)-pack$ {
            limit_conn demo_conn 10;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://refweird_demo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/demo/agent-run {
            limit_req zone=demo_run burst=3 nodelay;
            limit_conn demo_conn 2;
            proxy_read_timeout 120s;
            proxy_pass http://refweird_demo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Server-sent events for the agent activity stream.
        location = /api/v1/agent/activities {
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_pass http://refweird_demo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=demo_api burst=60 nodelay;
            limit_conn demo_conn 20;
            proxy_pass http://refweird_demo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
