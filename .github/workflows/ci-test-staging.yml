name: Staging, Security & Integration Pipeline

on:
  push:
    branches: [main]
  schedule:
    # Nightly verification at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-deep:
    name: Go Race Tests & Deep Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js for embedded webui
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pre-build embedded Web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Verify zero-CGO compilation
        env:
          CGO_ENABLED: 0
        run: |
          go build -v ./cmd/refweir ./cmd/refweird

      - name: Run all Go unit & integration tests with race detector
        run: go test -v -race ./...

      - name: Verify generated capability counts
        run: |
          go run ./internal/tools/gencounts
          git diff --exit-code docs/generated/capability_counts.md

  security-audit:
    name: Security Scanners & Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install security tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run govulncheck vulnerability scanner
        run: govulncheck ./...

      - name: Run gosec AST security audit
        run: gosec ./...

      - name: Detect hardcoded secrets with Gitleaks
        run: gitleaks detect --source . --redact

  lifecycle-smoke:
    name: End-to-End Lifecycle Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run first-run bootstrap verification
        run: ./scripts/test_first_run.sh

      - name: Run lifecycle smoke test
        run: ./scripts/smoke_test_lifecycle.sh

      - name: Verify container contracts
        run: ./scripts/test_container_contract.sh

      - name: Verify quickstart script consistency
        run: ./scripts/check_quickstart_consistency.sh
