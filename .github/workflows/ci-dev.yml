name: Fast PR & Dev Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-dev:
    name: Backend Fast Test & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify zero-CGO compilation
        env:
          CGO_ENABLED: 0
        run: |
          go build -v ./cmd/refweir ./cmd/refweird

      - name: Run go vet
        run: go vet ./...

      - name: Check code formatting
        run: test -z "$(gofmt -l .)"

      - name: Fast unit test suite
        run: go test -short ./...

  frontend-dev:
    name: Web UI Vitest & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm test

      - name: Production bundle compilation
        run: npm run build

  site-dev:
    name: Marketing & Docs Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Full gate (typecheck + build + check-links + claims-audit)
        run: npm run verify
